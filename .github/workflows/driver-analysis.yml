name: Driver analysis

on:
  push:
    paths:
      - '.github/workflows/driver-analysis.yml'
      - 'ghidra/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      release_id:
        description: Draft release ID containing the corpus assets
        required: true
        default: '390358348'
      xp_asset_id:
        description: Release asset ID for nv4_mini.sys
        required: true
        default: '569106389'
      win7_asset_id:
        description: Release asset ID for nvlddmkm.sys
        required: true
        default: '569106473'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.CORPUS_TOKEN }}
      RELEASE_ID: ${{ inputs.release_id || '390358348' }}
      XP_ASSET_ID: ${{ inputs.xp_asset_id || '569106389' }}
      WIN7_ASSET_ID: ${{ inputs.win7_asset_id || '569106473' }}

    steps:
      - name: Verify corpus token is configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Missing repository secret CORPUS_TOKEN." >&2
            exit 1
          fi
          echo "CORPUS_TOKEN is configured."

      - name: Checkout analysis code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Download corpus assets by fixed release/asset IDs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/drivers work/reports
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          draft="$(printf '%s' "$release_json" | jq -r '.draft')"
          if [[ "$draft" != "true" ]]; then
            echo "Release ID ${RELEASE_ID} is not a draft release" >&2
            exit 1
          fi
          printf '%s\n' "$release_json" | jq '{id, name, tag_name, draft, assets: [.assets[] | {id, name, size, digest}]}' > work/reports/corpus_release.json

          download_asset_id() {
            local asset_id="$1"
            local expected_name="$2"
            local out="$3"
            local asset_json asset_name
            asset_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}")"
            asset_name="$(printf '%s' "$asset_json" | jq -r '.name')"
            if [[ "$asset_name" != "$expected_name" ]]; then
              echo "Asset ID ${asset_id} is ${asset_name}, expected ${expected_name}" >&2
              exit 1
            fi
            gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "$out"
            test -s "$out"
          }

          download_asset_id "$XP_ASSET_ID" "nv4_mini.sys" work/drivers/nv4_mini.sys
          download_asset_id "$WIN7_ASSET_ID" "nvlddmkm.sys" work/drivers/nvlddmkm.sys
          sha256sum work/drivers/*.sys | tee work/reports/input_sha256.txt

      - name: Static PE scans
        shell: bash
        run: |
          set -euo pipefail
          python scripts/scan_pe.py work/drivers/nv4_mini.sys --out work/reports/xp_pe.json
          python scripts/scan_pe.py work/drivers/nvlddmkm.sys --out work/reports/win7_pe.json
          python scripts/scan_pascal_firmware.py work/drivers/nv4_mini.sys --out work/reports/xp_firmware.json
          python scripts/scan_pascal_firmware.py work/drivers/nvlddmkm.sys --out work/reports/win7_firmware.json

      - name: Install Ghidra and PyGhidra
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/tools
          release_json="$(gh api repos/NationalSecurityAgency/ghidra/releases/latest)"
          url="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' | head -n1)"
          if [[ -z "$url" || "$url" == "null" ]]; then
            echo "Could not locate a Ghidra release ZIP" >&2
            exit 1
          fi
          curl -fL "$url" -o work/tools/ghidra.zip
          unzip -q work/tools/ghidra.zip -d work/tools
          ghidra_root="$(find work/tools -mindepth 1 -maxdepth 1 -type d -name 'ghidra_*' | head -n1)"
          if [[ -z "$ghidra_root" ]]; then
            echo "Ghidra root directory not found" >&2
            exit 1
          fi
          ghidra_root="$(realpath "$ghidra_root")"
          python -m venv work/tools/pyghidra-venv
          work/tools/pyghidra-venv/bin/python -m pip install --upgrade pip
          work/tools/pyghidra-venv/bin/python -m pip install --no-index -f "$ghidra_root/Ghidra/Features/PyGhidra/pypkg/dist" pyghidra
          work/tools/pyghidra-venv/bin/python -c "import pyghidra; print('PyGhidra import OK')"
          echo "GHIDRA_INSTALL_DIR=$ghidra_root" >> "$GITHUB_ENV"
          echo "PYGHIDRA_PYTHON=$GITHUB_WORKSPACE/work/tools/pyghidra-venv/bin/python" >> "$GITHUB_ENV"

      - name: PyGhidra headless XP recipient
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/ghidra-projects
          "$PYGHIDRA_PYTHON" -m pyghidra.ghidra_launch \
            --install-dir "$GHIDRA_INSTALL_DIR" \
            ghidra.app.util.headless.AnalyzeHeadless \
            "$GITHUB_WORKSPACE/work/ghidra-projects" xp_recipient \
            -import "$GITHUB_WORKSPACE/work/drivers/nv4_mini.sys" \
            -scriptPath "$GITHUB_WORKSPACE/ghidra" \
            -postScript ExportProgramFacts.py "$GITHUB_WORKSPACE/work/reports/xp_program_facts.json" \
            -deleteProject
          test -s work/reports/xp_program_facts.json

      - name: PyGhidra headless Win7 donor
        shell: bash
        run: |
          set -euo pipefail
          "$PYGHIDRA_PYTHON" -m pyghidra.ghidra_launch \
            --install-dir "$GHIDRA_INSTALL_DIR" \
            ghidra.app.util.headless.AnalyzeHeadless \
            "$GITHUB_WORKSPACE/work/ghidra-projects" win7_donor \
            -import "$GITHUB_WORKSPACE/work/drivers/nvlddmkm.sys" \
            -scriptPath "$GITHUB_WORKSPACE/ghidra" \
            -postScript ExportProgramFacts.py "$GITHUB_WORKSPACE/work/reports/win7_program_facts.json" \
            -deleteProject
          test -s work/reports/win7_program_facts.json

      - name: Build comparison and candidate reports
        shell: bash
        run: |
          set -euo pipefail
          python scripts/compare_program_facts.py work/reports/xp_program_facts.json work/reports/win7_program_facts.json --out work/reports/xp_vs_win7_program_facts.json
          python scripts/find_pascal_candidates.py work/reports/xp_program_facts.json --out work/reports/xp_pascal_candidates.json
          python scripts/find_pascal_candidates.py work/reports/win7_program_facts.json --out work/reports/win7_pascal_candidates.json

      - name: Remove proprietary input binaries before artifact upload
        if: always()
        shell: bash
        run: rm -rf work/drivers work/ghidra-projects work/tools

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pascal-xp-36881-analysis-${{ github.run_number }}
          path: work/reports/
          if-no-files-found: warn
          retention-days: 30
