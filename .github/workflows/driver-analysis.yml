name: Driver analysis

on:
  push:
    paths:
      - '.github/workflows/driver-analysis.yml'
      - 'ghidra/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      analysis_mode:
        description: 'auto uses cache; compare-only requires valid XP and Win7 caches'
        type: choice
        options: [auto, compare-only]
        default: auto
      release_id:
        description: Draft release ID containing the corpus assets
        required: true
        default: '390358348'
      xp_asset_id:
        description: Release asset ID for nv4_mini.sys
        required: true
        default: '569106389'
      win7_asset_id:
        description: Release asset ID for nvlddmkm.sys
        required: true
        default: '569106473'

concurrency:
  group: driver-analysis-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: xp
            project: xp_recipient
            asset_env: XP_ASSET_ID
            expected_name: nv4_mini.sys
            driver_name: nv4_mini.sys
          - platform: win7
            project: win7_donor
            asset_env: WIN7_ASSET_ID
            expected_name: nvlddmkm.sys
            driver_name: nvlddmkm.sys
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.CORPUS_TOKEN }}
      GHIDRA_ZIP_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
      GHIDRA_ZIP_SHA256: ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db
      RELEASE_ID: ${{ inputs.release_id || '390358348' }}
      XP_ASSET_ID: ${{ inputs.xp_asset_id || '569106389' }}
      WIN7_ASSET_ID: ${{ inputs.win7_asset_id || '569106473' }}

    steps:
      - name: Checkout analysis code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compute report cache key
        id: report-key
        shell: bash
        run: |
          asset_id="${!ASSET_ENV}"
          python scripts/analysis_cache.py key --platform "$PLATFORM" --release-id "$RELEASE_ID" --asset-id "$asset_id"
        env:
          PLATFORM: ${{ matrix.platform }}
          ASSET_ENV: ${{ matrix.asset_env }}

      - name: Restore report cache
        id: report-cache
        uses: actions/cache/restore@v4
        with:
          path: work/cache/${{ matrix.platform }}
          key: focused-json-v1-${{ runner.os }}-${{ matrix.platform }}-${{ steps.report-key.outputs.key }}

      - name: Validate restored reports
        id: cache-validation
        shell: bash
        run: |
          python scripts/analysis_cache.py restore --platform "${{ matrix.platform }}" --key "${{ steps.report-key.outputs.key }}" --cache-dir "work/cache/${{ matrix.platform }}" --reports-dir work/reports

      - name: Reject corrupted cached data
        if: steps.report-cache.outputs.cache-hit == 'true' && steps.cache-validation.outputs.valid != 'true'
        run: |
          echo "::error::Invalid existing cache. Delete its entry in Actions Caches before retrying."
          exit 1

      - name: Require cache in compare-only mode
        if: inputs.analysis_mode == 'compare-only' && steps.cache-validation.outputs.valid != 'true'
        run: |
          echo "::error::Compare-only requested, but validated focused reports are missing."
          exit 1

      - name: Download selected corpus asset
        if: steps.cache-validation.outputs.valid != 'true' && inputs.analysis_mode != 'compare-only'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          mkdir -p work/drivers work/reports
          asset_id="${!ASSET_ENV}"
          asset_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}")"
          asset_name="$(printf '%s' "$asset_json" | jq -r '.name')"
          test "$asset_name" = "$EXPECTED_NAME"
          gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "work/drivers/${DRIVER_NAME}"
          test -s "work/drivers/${DRIVER_NAME}"
          sha256sum "work/drivers/${DRIVER_NAME}" > "work/reports/${PLATFORM}_input_sha256.txt"
          python -c 'import hashlib,json,sys; p,platform=sys.argv[1:]; expected=json.load(open("scripts/registration_followup_manifest.json"))["input_sha256"][platform]; actual=hashlib.sha256(open(p,"rb").read()).hexdigest(); assert actual==expected, "focused RVA manifest does not match input binary"' "work/drivers/${DRIVER_NAME}" "$PLATFORM"
        env:
          PLATFORM: ${{ matrix.platform }}
          ASSET_ENV: ${{ matrix.asset_env }}
          EXPECTED_NAME: ${{ matrix.expected_name }}
          DRIVER_NAME: ${{ matrix.driver_name }}

      - name: Install Ghidra and PyGhidra
        if: steps.cache-validation.outputs.valid != 'true' && inputs.analysis_mode != 'compare-only'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/tools
          curl -fL "$GHIDRA_ZIP_URL" -o work/tools/ghidra.zip
          echo "$GHIDRA_ZIP_SHA256  work/tools/ghidra.zip" | sha256sum -c -
          unzip -q work/tools/ghidra.zip -d work/tools
          ghidra_root="$(find work/tools -mindepth 1 -maxdepth 1 -type d -name 'ghidra_*' | head -n1)"
          ghidra_root="$(realpath "$ghidra_root")"
          python -m venv work/tools/pyghidra-venv
          work/tools/pyghidra-venv/bin/python -m pip install --no-index -f "$ghidra_root/Ghidra/Features/PyGhidra/pypkg/dist" pyghidra
          echo "GHIDRA_INSTALL_DIR=$ghidra_root" >> "$GITHUB_ENV"
          echo "PYGHIDRA_PYTHON=$GITHUB_WORKSPACE/work/tools/pyghidra-venv/bin/python" >> "$GITHUB_ENV"

      - name: Focused PyGhidra analysis
        if: steps.cache-validation.outputs.valid != 'true' && inputs.analysis_mode != 'compare-only'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/ghidra-projects
          "$PYGHIDRA_PYTHON" -m pyghidra.ghidra_launch             --install-dir "$GHIDRA_INSTALL_DIR"             ghidra.app.util.headless.AnalyzeHeadless             "$GITHUB_WORKSPACE/work/ghidra-projects" "$PROJECT"             -import "$GITHUB_WORKSPACE/work/drivers/$DRIVER_NAME"             -scriptPath "$GITHUB_WORKSPACE/ghidra"             -postScript ExportFecsTableRoots.py "$GITHUB_WORKSPACE/work/reports/${PLATFORM}_fecs_table_roots.json" "$PLATFORM"             -postScript ExportFecsDescriptorParents.py "$GITHUB_WORKSPACE/work/reports/${PLATFORM}_fecs_descriptor_parents.json" "$PLATFORM"             -postScript ExportGp106ResourceWiring.py "$GITHUB_WORKSPACE/work/reports/${PLATFORM}_gp106_resource_wiring.json" "$PLATFORM"             -postScript ExportGp106ConstructorPatterns.py "$GITHUB_WORKSPACE/work/reports/${PLATFORM}_gp106_constructor_patterns.json" "$PLATFORM"             -postScript ExportGp106ConstructorOwnership.py "$GITHUB_WORKSPACE/work/reports/${PLATFORM}_gp106_constructor_patterns.json" "$GITHUB_WORKSPACE/work/reports/${PLATFORM}_gp106_constructor_ownership.json" "$PLATFORM"             -postScript ExportDescriptorOwnerChains.py "$GITHUB_WORKSPACE/work/reports/${PLATFORM}_fecs_descriptor_parents.json" "$GITHUB_WORKSPACE/work/reports/${PLATFORM}_descriptor_owner_chains.json" "$PLATFORM"             -postScript ExportFocusedConstructorTrace.py "$GITHUB_WORKSPACE/work/reports/${PLATFORM}_focused_constructor_trace.json" "$PLATFORM"             -postScript ExportResourceOverrideWrappers.py "$GITHUB_WORKSPACE/work/reports/${PLATFORM}_resource_override_wrappers.json" "$PLATFORM"             -postScript ExportRegistrationFollowup.py "$GITHUB_WORKSPACE/scripts/registration_followup_manifest.json" "$GITHUB_WORKSPACE/work/reports/${PLATFORM}_registration_followup.json" "$PLATFORM"             -postScript ExportClassRegistryLookup.py "$GITHUB_WORKSPACE/work/reports/${PLATFORM}_class_registry_lookup.json" "$PLATFORM"             -postScript ExportRegistryGlobalConsumers.py "$GITHUB_WORKSPACE/work/reports/${PLATFORM}_registry_global_consumers.json" "$PLATFORM"             -postScript ExportFecsHelperCallers.py "$GITHUB_WORKSPACE/work/reports/${PLATFORM}_fecs_helper_callers.json" "$PLATFORM"             -deleteProject
          test -s "work/reports/${PLATFORM}_fecs_table_roots.json"
          test -s "work/reports/${PLATFORM}_fecs_descriptor_parents.json"
          test -s "work/reports/${PLATFORM}_descriptor_owner_chains.json"
          test -s "work/reports/${PLATFORM}_gp106_constructor_patterns.json"
          test -s "work/reports/${PLATFORM}_gp106_constructor_ownership.json"
          test -s "work/reports/${PLATFORM}_focused_constructor_trace.json"
          test -s "work/reports/${PLATFORM}_resource_override_wrappers.json"
          test -s "work/reports/${PLATFORM}_fecs_helper_callers.json"
          test -s "work/reports/${PLATFORM}_registration_followup.json"
          test -s "work/reports/${PLATFORM}_class_registry_lookup.json"
          test -s "work/reports/${PLATFORM}_registry_global_consumers.json"
        env:
          PLATFORM: ${{ matrix.platform }}
          PROJECT: ${{ matrix.project }}
          DRIVER_NAME: ${{ matrix.driver_name }}

      - name: Stage validated new report cache
        if: steps.cache-validation.outputs.valid != 'true' && inputs.analysis_mode != 'compare-only'
        run: |
          python scripts/analysis_cache.py stage --platform "${{ matrix.platform }}" --key "${{ steps.report-key.outputs.key }}" --cache-dir "work/cache/${{ matrix.platform }}" --reports-dir work/reports

      - name: Save complete report cache
        if: steps.cache-validation.outputs.valid != 'true' && inputs.analysis_mode != 'compare-only'
        uses: actions/cache/save@v4
        with:
          path: work/cache/${{ matrix.platform }}
          key: focused-json-v1-${{ runner.os }}-${{ matrix.platform }}-${{ steps.report-key.outputs.key }}

      - name: Remove proprietary input
        if: always()
        run: rm -rf work/drivers work/ghidra-projects work/tools

      - name: Upload focused reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: focused-${{ matrix.platform }}-${{ github.run_number }}
          path: work/reports/
          if-no-files-found: error
          retention-days: 14

  compare:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout analysis code
        uses: actions/checkout@v4

      - name: Download focused reports
        uses: actions/download-artifact@v4
        with:
          pattern: focused-*-${{ github.run_number }}
          path: work/artifacts

      - name: Merge and rank actionable targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/reports
          find work/artifacts -type f -name '*.json' -exec cp {} work/reports/ \;
          python scripts/compare_gp106_constructor_ownership.py             --xp work/reports/xp_gp106_constructor_ownership.json             --win7 work/reports/win7_gp106_constructor_ownership.json             --xp_roots work/reports/xp_fecs_table_roots.json             --win7_roots work/reports/win7_fecs_table_roots.json             --xp_parents work/reports/xp_fecs_descriptor_parents.json             --win7_parents work/reports/win7_fecs_descriptor_parents.json             --out work/reports/xp_vs_win7_gp106_constructor_ownership.json
          python scripts/compare_resource_override_wrappers.py             --xp work/reports/xp_resource_override_wrappers.json             --win7 work/reports/win7_resource_override_wrappers.json             --out work/reports/xp_vs_win7_resource_override_wrappers.json
          test -s work/reports/xp_vs_win7_resource_override_wrappers.json
          python scripts/compare_descriptor_owner_chains.py --xp work/reports/xp_descriptor_owner_chains.json --win7 work/reports/win7_descriptor_owner_chains.json --out work/reports/xp_vs_win7_descriptor_owner_chains.json
          python scripts/audit_sec2_wrapper.py --win7-trace work/reports/win7_focused_constructor_trace.json --out work/reports/sec2_wrapper_audit.json
          test -s work/reports/xp_vs_win7_descriptor_owner_chains.json
          python scripts/compare_registration_followup.py --manifest scripts/registration_followup_manifest.json --xp work/reports/xp_registration_followup.json --win7 work/reports/win7_registration_followup.json --out work/reports/xp_vs_win7_registration_followup.json
          python scripts/audit_registration_lifecycle.py --manifest scripts/registration_followup_manifest.json --xp work/reports/xp_registration_followup.json --win7 work/reports/win7_registration_followup.json --out work/reports/registration_lifecycle_audit.json
          test -s work/reports/registration_lifecycle_audit.json
          python scripts/rank_registration_followup.py --manifest scripts/registration_followup_manifest.json --helper-report work/reports/xp_vs_win7_registration_followup.json --out work/reports/registration_followup_ranked.json
          test -s work/reports/registration_followup_ranked.json
          python scripts/audit_fecs_ucode_dispatch.py --xp work/reports/xp_gp106_resource_wiring.json --win7 work/reports/win7_gp106_resource_wiring.json --out work/reports/xp_vs_win7_fecs_ucode_dispatch.json
          test -s work/reports/xp_vs_win7_fecs_ucode_dispatch.json
          python scripts/audit_fecs_root_registration.py --owner-chains work/reports/xp_descriptor_owner_chains.json --fecs-roots work/reports/xp_fecs_table_roots.json --out work/reports/xp_fecs_root_registration.json
          python scripts/audit_fecs_root_registration.py --owner-chains work/reports/win7_descriptor_owner_chains.json --fecs-roots work/reports/win7_fecs_table_roots.json --out work/reports/win7_fecs_root_registration.json
          python scripts/compare_class_registry_lookup.py --xp work/reports/xp_class_registry_lookup.json --win7 work/reports/win7_class_registry_lookup.json --out work/reports/xp_vs_win7_class_registry_lookup.json
          test -s work/reports/xp_fecs_root_registration.json
          test -s work/reports/win7_fecs_root_registration.json
          test -s work/reports/xp_vs_win7_class_registry_lookup.json
          python scripts/compare_registry_global_consumers.py --xp work/reports/xp_registry_global_consumers.json --win7 work/reports/win7_registry_global_consumers.json --out work/reports/xp_vs_win7_registry_global_consumers.json
          test -s work/reports/xp_vs_win7_registry_global_consumers.json
          python scripts/summarize_analysis.py
          test -s work/reports/xp_vs_win7_gp106_constructor_ownership.json
          test -s work/reports/analysis_summary.json
          test -s work/reports/analysis_summary.md

      - name: Upload ranked analysis
        uses: actions/upload-artifact@v4
        with:
          name: pascal-xp-focused-analysis-${{ github.run_number }}
          path: work/reports/
          if-no-files-found: error
          retention-days: 30
